<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>06 内嵌编辑模式 - Algeo SDK</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 16px;
      }

      .page {
        margin: 0 auto;
      }

      .stack {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      h1 {
        font-size: 1.25rem;
        margin: 0 0 8px;
      }

      .desc {
        color: #666;
        font-size: 0.875rem;
        margin-bottom: 12px;
        line-height: 1.6;
      }

      button {
        padding: 8px 16px;
        border: none;
        border-radius: 8px;
        font: inherit;
        font-size: 0.8125rem;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.15s, border-color 0.15s;
      }

      button:focus-visible,
      select:focus-visible {
        outline: 3px solid #bfdbfe;
        outline-offset: 2px;
      }

      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      select {
        padding: 8px 12px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        background: white;
        font: inherit;
      }

      button.primary {
        background: #2563eb;
        color: white;
      }

      button.primary:hover:not(:disabled) {
        background: #1d4ed8;
      }

      button.secondary {
        background: white;
        color: #111827;
        border: 1px solid #d1d5db;
      }

      button.secondary:hover:not(:disabled) {
        background: #f9fafb;
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1.7fr) minmax(320px, 0.9fr);
        gap: 16px;
        align-items: stretch;
      }

      .embed-column,
      .side-column {
        min-width: 0;
      }

      .side-column {
        display: flex;
      }

      .controls {
        width: 100%;
        border: 1px solid #e2e8f0;
        border-radius: 14px;
        background: #fff;
        box-shadow: 0 4px 20px rgb(15 23 42 / 4%);
        max-height: 600px;
        overflow: auto;
      }

      .config-section {
        padding: 18px;
      }

      .config-section + .config-section {
        border-top: 1px solid #e2e8f0;
      }

      .create-section {
        background: #f8faff;
      }

      .section-heading {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 8px;
      }

      .section-number {
        display: grid;
        place-items: center;
        width: 26px;
        height: 26px;
        border: 1px solid #dbeafe;
        border-radius: 8px;
        background: #eff6ff;
        color: #2563eb;
        font-size: 0.6875rem;
        font-weight: 700;
      }

      .controls h2 {
        margin: 0;
        color: #0f172a;
        font-size: 0.9375rem;
        font-weight: 600;
      }

      .controls p {
        margin: 0 0 14px;
        color: #64748b;
        font-size: 0.8125rem;
        line-height: 1.6;
      }

      .create-form {
        display: flex;
        align-items: flex-end;
        flex-wrap: wrap;
        gap: 10px;
      }

      .mode-field {
        display: flex;
        flex: 1 1 130px;
        flex-direction: column;
        gap: 6px;
        color: #475569;
        font-size: 0.75rem;
        font-weight: 500;
      }

      .mode-field select {
        width: 100%;
        min-height: 38px;
        color: #0f172a;
      }

      .create-form button {
        min-height: 38px;
        flex: 1 1 120px;
      }

      .config-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 12px;
      }

      .config-actions button {
        flex: 1 1 auto;
        padding: 7px 10px;
      }

      .control-grid {
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        overflow: hidden;
      }

      .control-card {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 8px 12px;
      }

      .control-card + .control-card {
        border-top: 1px solid #f1f5f9;
      }

      .control-card h3 {
        margin: 0;
        color: #334155;
        font-size: 0.8125rem;
        font-weight: 500;
      }

      .visibility-toggle {
        flex-shrink: 0;
        min-width: 76px;
        padding: 7px 16px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        background: #fff;
        color: #334155;
        box-shadow: 0 1px 2px rgb(15 23 42 / 8%);
        font-size: 0.8125rem;
      }

      .visibility-toggle:hover:not(:disabled) {
        border-color: #93c5fd;
        background: #eff6ff;
        color: #1d4ed8;
      }

      .visibility-toggle:active:not(:disabled) {
        background: #dbeafe;
        box-shadow: inset 0 1px 2px rgb(15 23 42 / 12%);
      }

      .logs {
        padding: 12px;
        border-radius: 8px;
        background: #111827;
        color: #e5e7eb;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.8125rem;
        min-height: 160px;
        max-height: 260px;
        white-space: pre-wrap;
        word-break: break-word;
        overflow: auto;
      }

      .embed-wrap {
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        overflow: hidden;
        height: 600px;
        max-height: 600px;
        background: #fafafa;
      }

      .embed-wrap > div {
        width: 100%;
        height: 100%;
      }

      .panel {
        padding: 12px;
        border-radius: 8px;
        background: #f5f5f5;
        font-family: monospace;
        font-size: 0.8125rem;
        min-height: 96px;
        max-height: 180px;
        white-space: pre-wrap;
        word-break: break-all;
        overflow: auto;
      }

      .note {
        margin-top: 8px;
        color: #666;
        font-size: 0.8125rem;
      }

      a {
        color: #06c;
      }

      @media (max-width: 960px) {
        .layout {
          grid-template-columns: 1fr;
        }

        .controls {
          max-height: none;
        }

        .embed-wrap {
          height: 360px;
          max-height: none;
        }

        .panel,
        .logs {
          max-height: none;
        }
      }
    </style>
  </head>

  <body>
    <div class="page">
      <a href="index.html">← 返回示例列表</a>
      <h1>06 内嵌编辑模式</h1>
      <p class="desc">
        支持创建 2D / 3D 空白画板，并测试编辑模式下的
        <code>setUiConfig</code> / <code>getUiConfig</code>。
      </p>

      <div class="stack">
        <div class="layout">
          <div class="embed-column">
            <div class="embed-wrap">
              <div id="algeo-container"></div>
            </div>
          </div>

          <div class="side-column">
            <div class="controls">
              <section class="config-section create-section" aria-labelledby="createHeading">
                <div class="section-heading">
                  <span class="section-number" aria-hidden="true">01</span>
                  <h2 id="createHeading">新建空白画板</h2>
                </div>
                <p>选择画板模式，创建后将替换当前编辑内容。</p>
                <div class="create-form">
                  <label class="mode-field" for="initialModeSelect">
                    画板模式
                    <select id="initialModeSelect">
                      <option value="2d">2D 平面画板</option>
                      <option value="3d">3D 立体画板</option>
                    </select>
                  </label>
                  <button class="primary" id="createBlankBtn">创建空白画板</button>
                </div>
              </section>
              <section class="config-section" aria-labelledby="configHeading">
                <div class="section-heading">
                  <span class="section-number" aria-hidden="true">02</span>
                  <h2 id="configHeading">界面配置</h2>
                </div>
                <p>点击“显示 / 隐藏”调整对应模块，可随时读取当前配置。</p>
                <div class="config-actions">
                  <button class="secondary" id="readConfigBtn">读取当前配置</button>
                  <button class="secondary" id="showAllBtn">全部显示</button>
                  <button class="secondary" id="hideAllBtn">全部隐藏</button>
                </div>
                <div class="control-grid" id="controlGrid"></div>
              </section>
            </div>
          </div>
        </div>

        <div class="panel" id="panel">等待创建...</div>

        <div class="logs" id="logs">等待操作...</div>
      </div>
    </div>

    <script src="../dist/algeo-sdk.umd.js"></script>
    <script src="./assets/js/config.js"></script>
    <script>
      const { baseUrl, appId, shareId } = window.ALGEO_CONFIG;

      const container = document.getElementById('algeo-container');
      const initialModeSelect = document.getElementById('initialModeSelect');
      const createBlankBtn = document.getElementById('createBlankBtn');
      const panel = document.getElementById('panel');
      const logs = document.getElementById('logs');
      const controlGrid = document.getElementById('controlGrid');
      const readConfigBtn = document.getElementById('readConfigBtn');
      const showAllBtn = document.getElementById('showAllBtn');
      const hideAllBtn = document.getElementById('hideAllBtn');

      const uiFields = [
        { key: 'navbar', label: '顶部导航栏' },
        { key: 'slidePanel', label: '画板列表' },
        { key: 'toolboxPanel', label: '工具面板' },
        { key: 'algebraPanel', label: '代数面板' },
        { key: 'docPanel', label: '笔记面板' },
        { key: 'helpEntry', label: '帮助入口' },
        { key: 'aiChatPanel', label: 'AI 面板' },
      ];

      let sdk = null;
      let isInitializing = false;
      let currentUiConfig = null;

      function log(message, payload) {
        const lines = [new Date().toLocaleTimeString() + ' ' + message];
        if (payload !== undefined) {
          lines.push(JSON.stringify(payload, null, 2));
        }
        logs.textContent = lines.join('\n') + '\n\n' + logs.textContent;
      }

      function updatePanel(extra) {
        panel.textContent = [
          'mode: editor',
          'baseUrl: ' + baseUrl,
          'path: /embed/edit',
          extra || '',
        ]
          .filter(Boolean)
          .join('\n');
      }

      function updateToggleButtons(config) {
        currentUiConfig = config;
        controlGrid.querySelectorAll('button[data-key]').forEach((button) => {
          const key = button.getAttribute('data-key');
          if (!key) {
            return;
          }
          const visible = Boolean(config[key]);
          button.textContent = visible ? '隐藏' : '显示';
          const field = uiFields.find(({ key: fieldKey }) => fieldKey === key);
          button.setAttribute('aria-label', button.textContent + (field?.label || key));
        });
      }

      function ensureSdk() {
        if (!sdk) {
          throw new Error('请先创建 iframe');
        }
        return sdk;
      }

      async function readUiConfig() {
        const editor = ensureSdk();
        const config = editor.mode.getUiConfig();
        updateToggleButtons(config);
        updatePanel(
          'ready: ' +
            editor.ready +
            ', version: ' +
            (editor.version || '-') +
            '\nui: ' +
            JSON.stringify(config),
        );
        log('getUiConfig', config);
        return config;
      }

      async function setUiConfig(partialConfig, label) {
        const editor = ensureSdk();
        await editor.mode.setUiConfig(partialConfig);
        log('setUiConfig: ' + label, partialConfig);
        await readUiConfig();
      }

      function renderUiControls() {
        controlGrid.innerHTML = uiFields
          .map(
            ({ key, label }) => `
        <div class="control-card">
          <h3>${label}</h3>
          <button class="visibility-toggle" data-key="${key}"
            aria-label="${label}">读取中</button>
        </div>
      `,
          )
          .join('');

        controlGrid.querySelectorAll('button[data-key]').forEach((button) => {
          button.addEventListener('click', async () => {
            const key = button.getAttribute('data-key');
            if (!key) {
              return;
            }
            try {
              const config = currentUiConfig ?? (await readUiConfig());
              const nextValue = !Boolean(config[key]);
              await setUiConfig({ [key]: nextValue }, key + '=' + nextValue);
            } catch (e) {
              log('setUiConfig 失败', { message: e.message || String(e), key });
            }
          });
        });
      }

      renderUiControls();

      readConfigBtn.onclick = async () => {
        try {
          await readUiConfig();
        } catch (e) {
          log('getUiConfig 失败', { message: e.message || String(e) });
        }
      };

      showAllBtn.onclick = async () => {
        try {
          await setUiConfig(
            Object.fromEntries(uiFields.map(({ key }) => [key, true])),
            'showAll',
          );
        } catch (e) {
          log('全部显示失败', { message: e.message || String(e) });
        }
      };

      hideAllBtn.onclick = async () => {
        try {
          await setUiConfig(
            Object.fromEntries(uiFields.map(({ key }) => [key, false])),
            'hideAll',
          );
        } catch (e) {
          log('全部隐藏失败', { message: e.message || String(e) });
        }
      };

      async function initializeEditor({ blank = false } = {}) {
        if (isInitializing) {
          return;
        }
        isInitializing = true;
        const initialMode = initialModeSelect.value;
        const editorOptions = {
          auth: { appId },
          ...(blank ? { initialMode } : { shareId }),
        };
        const buttons = document.querySelectorAll('button');
        buttons.forEach((button) => {
          button.disabled = true;
        });
        initialModeSelect.disabled = true;
        updatePanel(
          blank
            ? '正在创建 ' + initialMode.toUpperCase() + ' 空白画板...'
            : '正在创建...',
        );
        log('create', {
          mode: 'editor',
          baseUrl,
          ...editorOptions,
        });

        try {
          const previousSdk = sdk;
          sdk = null;
          currentUiConfig = null;
          if (previousSdk) {
            await previousSdk.destroy();
          }
          container.innerHTML = '';
          sdk = await AlgeoSdk.create(container, {
            mode: 'editor',
            baseUrl,
            editor: editorOptions,
          });
          updatePanel(
            'ready: ' + sdk.ready + ', version: ' + (sdk.version || '-'),
          );
          log('create 成功', {
            ready: sdk.ready,
            version: sdk.version || '-',
          });
          await readUiConfig();
        } catch (e) {
          updatePanel('初始化未完成: ' + (e.message || String(e)));
          log('create 失败', { message: e.message || String(e) });
        } finally {
          isInitializing = false;
          buttons.forEach((button) => {
            button.disabled = !sdk;
          });
          createBlankBtn.disabled = false;
          initialModeSelect.disabled = false;
        }
      }

      createBlankBtn.onclick = () => initializeEditor({ blank: true });

      void initializeEditor();
    </script>
  </body>
</html>
