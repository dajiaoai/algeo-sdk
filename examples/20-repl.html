<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>20 REPL 指令实验室 - Algeo SDK</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        color: #18202f;
        background: #f3f6fb;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 20px;
      }
      a {
        color: #1267e9;
        text-underline-offset: 3px;
      }
      button,
      select,
      textarea {
        font: inherit;
      }
      button,
      .mode-link {
        border: 1px solid #d9e1ed;
        border-radius: 7px;
        padding: 8px 12px;
        background: white;
        color: #28364b;
        cursor: pointer;
      }
      button:hover,
      .mode-link:hover {
        border-color: #1267e9;
      }
      button:disabled {
        cursor: wait;
        opacity: 0.5;
      }
      :focus-visible {
        outline: 3px solid #83b4ff;
        outline-offset: 2px;
      }
      [hidden] {
        display: none !important;
      }
      .topbar,
      .toolbar,
      .panel-heading {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
      }
      .topbar {
        justify-content: space-between;
      }
      .mode-link {
        display: inline-block;
        text-decoration: none;
      }
      .mode-link[aria-current='page'],
      .primary {
        background: #1267e9;
        border-color: #1267e9;
        color: white;
      }
      h1 {
        margin: 20px 0 8px;
        font-size: 28px;
        letter-spacing: -0.5px;
      }
      h2 {
        font-size: 15px;
        margin: 0;
      }
      p {
        line-height: 1.6;
      }
      .intro,
      .hint {
        color: #697384;
        font-size: 13px;
      }
      .intro {
        margin: 0 0 16px;
        font-size: 14px;
      }
      .status {
        padding: 10px 14px;
        background: #e8effb;
        border-radius: 8px;
        margin-bottom: 16px;
        font-size: 13px;
        overflow-wrap: anywhere;
      }
      .status[data-state='error'] {
        color: #b42318;
        background: #fff0ed;
      }
      .workspace {
        display: grid;
        grid-template-columns: minmax(0, 1.4fr) minmax(360px, 1fr);
        gap: 16px;
      }
      .panel {
        display: flex;
        flex-direction: column;
        min-width: 0;
        background: white;
        border: 1px solid #dfe4ec;
        border-radius: 12px;
        overflow: hidden;
      }
      .panel-heading {
        flex-shrink: 0;
        min-height: 52px;
        padding: 12px 16px;
        border-bottom: 1px solid #e5eaf2;
        justify-content: space-between;
      }
      #mode-label {
        color: #697384;
        font-size: 12px;
      }
      #algeo-container {
        flex: 1 1 0;
        min-height: 520px;
      }
      #algeo-container iframe {
        display: block;
      }
      .console {
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .console label {
        font-size: 13px;
        font-weight: 650;
      }
      select {
        width: 100%;
        padding: 9px;
        border: 1px solid #d9e1ed;
        border-radius: 7px;
        background: white;
        color: inherit;
      }
      .hint {
        margin: 0;
      }
      #command {
        width: 100%;
        min-height: 200px;
        padding: 12px;
        border: 1px solid #d9e1ed;
        border-radius: 8px;
        resize: vertical;
        tab-size: 2;
        font:
          13px/1.6 ui-monospace,
          SFMono-Regular,
          Consolas,
          monospace;
      }
      .output-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      #output {
        height: 220px;
        overflow: auto;
        padding: 12px;
        background: #152033;
        color: #dfe9ff;
        border-radius: 8px;
      }
      #output p {
        font-size: 13px;
        color: #a9bad4;
        margin: 0;
      }
      #output pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font:
          12px/1.65 ui-monospace,
          SFMono-Regular,
          Consolas,
          monospace;
        margin: 0 0 16px;
      }
      #output pre.error {
        color: #ffb4aa;
      }
      .docs {
        margin: 0;
        font-size: 13px;
      }
      @media (max-width: 900px) {
        body {
          padding: 12px;
        }
        .workspace {
          grid-template-columns: minmax(0, 1fr);
        }
        #algeo-container {
          flex: none;
          height: 55vh;
          min-height: 360px;
        }
        h1 {
          font-size: 24px;
        }
      }
    </style>
  </head>
  <body>
    <nav class="topbar" aria-label="示例导航">
      <a href="index.html">← 返回示例列表</a>
      <div class="toolbar" aria-label="打开模式">
        <a class="mode-link" id="editor-link" href="?mode=editor">编辑模式</a>
        <a class="mode-link" id="presentation-link" href="?mode=presentation"
          >演示模式</a
        >
        <a href="/sdk/repl.html" target="_blank" rel="noopener"
          >完整 REPL 文档 ↗</a
        >
      </div>
    </nav>
    <h1>REPL 指令实验室</h1>
    <p class="intro">
      选择常用指令，修改代码并执行，实时观察画板变化。appId
      与初始分享内容统一读取示例配置。
    </p>
    <div id="status" class="status" role="status" aria-live="polite">
      正在初始化画板…
    </div>
    <main class="workspace">
      <section class="panel" aria-labelledby="canvas-heading">
        <div class="panel-heading">
          <h2 id="canvas-heading">画板预览</h2>
          <span id="mode-label"></span>
          <button id="reload" type="button">重新加载</button>
        </div>
        <div id="algeo-container"></div>
      </section>
      <section class="panel" aria-labelledby="console-heading">
        <div class="panel-heading">
          <h2 id="console-heading">指令与输出</h2>
          <span class="hint">Ctrl / ⌘ + Enter 执行</span>
        </div>
        <div class="console">
          <label for="preset">常用指令</label>
          <select id="preset"></select>
          <p class="hint" id="preset-description"></p>
          <label for="command">REPL 代码</label>
          <textarea
            id="command"
            spellcheck="false"
            aria-describedby="command-hint"
          ></textarea>
          <p class="hint" id="command-hint">
            整段发送，支持多行事件。执行会修改当前画板；示例可直接运行，无需先运行其他示例。
          </p>
          <div class="toolbar">
            <button class="primary" id="run" type="button" disabled>
              执行指令
            </button>
            <button id="undo" type="button" disabled hidden>撤销</button>
            <button id="redo" type="button" disabled hidden>重做</button>
          </div>
          <div class="output-heading">
            <h2 id="output-heading">执行结果</h2>
            <button id="clear-output" type="button">清空输出</button>
          </div>
          <div
            id="output"
            role="region"
            aria-labelledby="output-heading"
            tabindex="0"
          >
            <p>选择指令并执行，文本结果会显示在这里。</p>
          </div>
          <p class="docs">
            继续探索：<a href="/sdk/repl.html" target="_blank" rel="noopener"
              >查看完整命令、几何类型与动画交互文档 ↗</a
            >
          </p>
        </div>
      </section>
    </main>
    <script src="../dist/algeo-sdk.umd.js"></script>
    <script src="./assets/js/config.js"></script>
    <script src="./assets/js/repl.js"></script>
  </body>
</html>
